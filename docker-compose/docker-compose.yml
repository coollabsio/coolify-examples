services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NPM_TOKEN: ${NPM_TOKEN:?NPM_TOKEN not set}
    ports:
      - "3000"
    environment:
      - PORT=3000
      - DB_CONNECTION=postgres
      - TEST=${TEST}
  analytics_test_2:
    image: nginx
    environment:
      - API_URL=$SERVICE_FQDN_API
